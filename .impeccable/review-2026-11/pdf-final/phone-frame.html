<!doctype html><meta charset="utf-8">

<style>
/* Each PDF card as the top of an iPhone: black frame on top and sides, Dynamic Island,
   status bar; the phone runs off the bottom of the card. */
body{margin:0;background:transparent;font-family:"Source Sans 3",sans-serif}
.c{width:307px;height:448px;box-sizing:border-box;background:#1d1a14;padding:7px 7px 0;border-radius:40px 40px 0 0;display:flex}
.scr{flex:1;border-radius:33px 33px 0 0;overflow:hidden;display:flex;flex-direction:column;background:oklch(0.961 0.044 93.1)}
.sb{height:26px;flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:10.5px;font-weight:600;color:#1d1a14}
.island{position:absolute;left:50%;top:6px;width:72px;height:19px;margin-left:-36px;border-radius:10px;background:#0b0a08}
.ic{display:flex;gap:4px;align-items:center}
.bars{display:flex;gap:1px;align-items:flex-end}.bars i{width:2.5px;background:#1d1a14;border-radius:1px}
.bat{width:17px;height:8.5px;border:1px solid #1d1a14;border-radius:2.5px;padding:1px;box-sizing:border-box}.bat i{display:block;height:100%;width:78%;background:#1d1a14;border-radius:1px}
.scr img{display:block;width:100%;flex:1;min-height:0;object-fit:cover;object-position:top}
</style>
